<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warnings — Admin Dashboard</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ctu-theme') || localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
      }
      const savedLang = localStorage.getItem('ctu-lang') || localStorage.getItem('language') || 'en';
      document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('lang', savedLang);
    })();
  </script>

  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/support.css">
  <link rel="stylesheet" href="../css/animations.css">
  
  <style>
    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .issue-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .issue-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .issue-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    .issue-meta {
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }
    .issue-body {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .issue-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      border-top: 1px solid var(--border-glass);
      padding-top: 1rem;
      flex-wrap: wrap;
    }
    .status-select {
      padding: 0.4rem 2rem 0.4rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23131313%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 0.7rem top 50%;
      background-size: 0.65rem auto;
      cursor: pointer;
    }
    [data-theme="dark"] .status-select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    }
    .status-select.active_warning { border-color: var(--danger-300); color: var(--danger-500); }
    .status-select.resolved { border-color: var(--success-300); color: var(--success-600); }
    
    @media (min-width: 768px) {
      .issue-header { align-items: center; }
    }
  </style>
</head>
<body>
  <!-- [BACKEND HINT]: Add PHP Session authentication check at the very top of this file.
       If the user is not logged in or role !== 'admin', redirect them to login.php. -->

  <div class="dashboard-layout" id="dashboard-layout">
    
    <!-- CTU Support — Sidebar Component -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background: linear-gradient(135deg, #DC2626, #F59E0B)">A</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Admin Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title">Navigation</div>
          <a href="admin-overview.html" class="sidebar-link">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
          </a>
          <a href="admin-users.html" class="sidebar-link">
            <i class="fas fa-users"></i><span>Users</span>
          </a>
          <a href="admin-attendance.html" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span>Attendance</span>
          </a>
          <a href="admin-warnings.html" class="sidebar-link active">
            <i class="fas fa-exclamation-triangle"></i><span>Warnings</span>
          </a>
          <a href="admin-custody.html" class="sidebar-link">
            <i class="fas fa-boxes-stacked"></i><span>Custody</span>
          </a>
          <a href="admin-reports.html" class="sidebar-link">
            <i class="fas fa-file-alt"></i><span>Daily Reports</span>
          </a>
          <a href="admin-trainings.html" class="sidebar-link">
            <i class="fas fa-chalkboard-teacher"></i><span>Trainings</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="sidebar-link" id="logout-btn" style="color: var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span>Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="../images/avatar-default.png" alt="User Avatar" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name" id="sidebar-user-name">System Admin</p>
            <p class="sidebar-user-role" id="sidebar-user-role">Administrator</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title">Warning Management</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button type="button" id="lang-toggle" class="topbar-toggle-btn" onclick="if(typeof toggleLanguage==='function')toggleLanguage()" aria-label="Toggle language" title="Toggle Language">
            <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z" stroke="currentColor" stroke-width="2"/><path d="M2 12h20" stroke="currentColor" stroke-width="2"/></svg>
            <span class="lang-pill">عربي</span>
          </button>
          <button type="button" id="theme-toggle" class="topbar-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle Theme">
            <svg class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="dashboard-content page-transition">

        <!-- Action Bar: Select Student & Add Warning -->
        <div class="flex-between mb-4">
          <div class="search-bar" style="max-width: 300px;">
            <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);"></i>
            <select class="form-control" style="padding-left: 2.5rem; width: 300px;">
              <option value="" disabled selected>Search & Select Student...</option>
              <option value="stu1">Sara Mohamed (STU-2026-001)</option>
              <option value="stu2">Ahmed Ali (STU-2026-002)</option>
            </select>
          </div>
          
          <div class="action-btns">
            <button type="button" class="btn btn-primary" onclick="document.getElementById('addWarningModal').classList.add('active'); document.body.style.overflow='hidden';"><i class="fas fa-plus"></i> Add Warning</button>
          </div>
        </div>

        <!-- Warnings Table -->
        <div class="table-container" style="background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow-x: auto;">
          <table class="table" style="width: 100%; min-width: 600px; text-align: left; border-collapse: collapse;">
            <thead>
              <tr style="background: var(--bg-secondary); border-bottom: 2px solid var(--border-default);">
                <th style="padding: 1rem;">Date</th>
                <th style="padding: 1rem;">Student</th>
                <th style="padding: 1rem;">Reason</th>
                <th style="padding: 1rem;">Status</th>
                <th style="padding: 1rem;">Actions</th>
              </tr>
            </thead>
            <tbody id="warnings-table-body">
              <!-- [BACKEND HINT]: Loop over warnings from database -->
              <tr style="border-bottom: 1px solid var(--border-default);">
                <td style="padding: 1rem;">2026-08-01</td>
                <td style="padding: 1rem;">Sara Mohamed</td>
                <td style="padding: 1rem;">Excessive absence in PC Lab</td>
                <td style="padding: 1rem;">
                  <span style="background: var(--danger-100); color: var(--danger-700); padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">Active</span>
                </td>
                <td style="padding: 1rem;">
                  <div class="action-btns" style="display: flex; gap: 0.25rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="/* trigger view modal */" title="View"><i class="fas fa-eye"></i></button>
                    <button type="button" class="btn btn-secondary btn-sm" style="color: var(--danger-500);" onclick="/* trigger delete */" title="Delete"><i class="fas fa-trash"></i></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Warning Modal -->
  <div id="addWarningModal" class="modal-overlay">
    <div class="modal">
      <button type="button" class="btn-icon modal-close" onclick="document.getElementById('addWarningModal').classList.remove('active'); document.body.style.overflow='';"><i class="fas fa-times"></i></button>
      <h4 style="margin-bottom: 1.5rem;">Add Warning</h4>
      <form method="POST" action="" onsubmit="event.preventDefault(); if(this.closest('.modal-overlay')) this.closest('.modal-overlay').classList.remove('active'); document.body.style.overflow='';">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Student</label>
          <select name="student_id" class="form-control" required>
            <option value="" disabled selected>Select Student</option>
            <option value="stu1">Sara Mohamed</option>
            <option value="stu2">Ahmed Ali</option>
          </select>
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Warning Reason</label>
          <textarea name="reason" class="form-control" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-paper-plane"></i> Submit Warning</button>
      </form>
    </div>
  </div>

  <!-- Shared Global JS -->
  <script src="../js/app.js"></script>
  <script>
    // Sidebar Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      const sidebarEl = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      
      if (sidebarToggle && sidebarOverlay && sidebarEl) {
        const toggleSidebar = () => {
          sidebarEl.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
        };
        const closeSidebar = () => {
          sidebarEl.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        };
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
      }
    });
  </script>
</body>
</html>
