<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CTU Support</title>
  
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p data-i18n="common.loading">Loading...</p>
  </div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background:linear-gradient(135deg,#DC2626,#F59E0B)">A</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Admin Panel</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title" data-i18n="dash.sidebar.management">Management</div>
          <a href="#overview" class="sidebar-link active">
            <i class="fas fa-th-large"></i><span data-i18n="dash.sidebar.dashboard">Dashboard</span>
          </a>
          <a href="#students" class="sidebar-link">
            <i class="fas fa-users"></i><span data-i18n="dash.sidebar.students">Students</span>
          </a>
          <a href="#attendance" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span data-i18n="dash.sidebar.attendance">Attendance</span>
          </a>
          <a href="#information" class="sidebar-link">
            <i class="fas fa-chart-bar"></i><span data-i18n="dash.sidebar.information">Information</span>
          </a>
          <a href="#meetings" class="sidebar-link">
            <i class="fas fa-handshake"></i><span>Meetings</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <a href="#" class="sidebar-link" id="logout-btn" style="color:var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span data-i18n="dash.sidebar.logout">Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="" alt="" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <h5 id="sidebar-name"></h5>
            <span id="sidebar-role"></span>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title" data-i18n="dash.sidebar.dashboard">Dashboard</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition" id="view">
        <!-- Views will be rendered here by dashboardRouter -->
      </div>
    </main>
  </div>

  <!-- Shared Global JS -->
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script type="module">
    import { requiresRole } from '../js/router/guard.js';
    import { logout } from '../js/api/auth.js';
    import { initRouter, registerRoutes } from '../js/router/dashboardRouter.js';
    import { getUser } from '../js/utils/jwt.js';

    // 1. Role Guard
    requiresRole('admin');

    // 2. Populate user info
    const user = getUser();
    if (user) {
      document.getElementById('sidebar-name').textContent = window.getLocalized ? window.getLocalized(user, 'name') : user.name;
      document.getElementById('sidebar-role').textContent = 'Administrator';
    }

    // 3. Setup Logout
    document.getElementById('logout-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
      window.location.href = '../login.html';
    });

    // 4. Setup Router
    registerRoutes({
      'overview': async (container) => {
        document.getElementById('topbar-title').textContent = window.t ? window.t('dash.sidebar.dashboard') : 'Dashboard';
        const module = await import('../js/views/admin/overview.js');
        return await module.render(container);
      },
      'students': async (container) => {
        document.getElementById('topbar-title').textContent = window.t ? window.t('dash.sidebar.students') : 'Students';
        const module = await import('../js/views/admin/students.js');
        return await module.render(container);
      },
      'attendance': async (container) => {
        document.getElementById('topbar-title').textContent = window.t ? window.t('dash.sidebar.attendance') : 'Attendance';
        const module = await import('../js/views/admin/attendanceReports.js');
        return await module.render(container);
      },
      'information': async (container) => {
        document.getElementById('topbar-title').textContent = window.t ? window.t('dash.sidebar.information') : 'Information';
        const module = await import('../js/views/admin/information.js');
        return await module.render(container);
      },
      'meetings': async (container) => {
        document.getElementById('topbar-title').textContent = window.t ? window.t('dash.sidebar.meetings') || 'Meetings' : 'Meetings';
        const module = await import('../js/views/admin/meetings.js');
        return await module.render(container);
      }
    });

    const viewContainer = document.getElementById('view');
    initRouter(viewContainer);
    
    // 5. Setup Theme and Language toggles
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn && window.toggleTheme) {
      themeBtn.addEventListener('click', window.toggleTheme);
    }
    
    const langBtn = document.getElementById('lang-toggle');
    if (langBtn && window.toggleLanguage) {
      langBtn.addEventListener('click', window.toggleLanguage);
    }
  </script>
</body>
</html>
