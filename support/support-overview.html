<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Assistant Panel</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ctu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/support.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <!-- [BACKEND HINT]: Add PHP Session authentication check at the very top of this file. -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p data-i18n="common.loading">Loading...</p>
  </div>

  <div class="dashboard-layout" id="dashboard-layout">
    
    <!-- CTU Support — Sidebar Component -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background: var(--primary-500)">A</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Assistant Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title">Navigation</div>
          <a href="support-overview.html" class="sidebar-link active">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
          </a>
          <a href="support-users.html" class="sidebar-link">
            <i class="fas fa-users"></i><span>Students</span>
          </a>
          <a href="support-attendance.html" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span>Attendance</span>
          </a>
          <a href="support-warnings.html" class="sidebar-link">
            <i class="fas fa-exclamation-triangle"></i><span>Warnings</span>
          </a>
          <a href="support-profile.html" class="sidebar-link">
            <i class="fas fa-user"></i><span>Profile</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="sidebar-link" id="logout-btn" style="color: var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span>Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="../images/team-2.jpg" alt="User Avatar" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name" id="sidebar-user-name">Assistant Name</p>
            <p class="sidebar-user-role" id="sidebar-user-role">Assistant</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title">Dashboard</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle" aria-label="Toggle language"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        
        <div class="mb-3">
          <h3 style="margin-bottom: 0.25rem;">Daily Overview</h3>
          <p class="text-muted">Summary of today's attendance and warnings.</p>
        </div>
        
        <!-- [BACKEND HINT]: Query the database to retrieve counts for these stat cards -->
        <div class="grid grid-2 mb-4">
          <div class="stat-card">
            <div class="stat-card-icon primary"><i class="fas fa-users"></i></div>
            <div class="stat-card-info">
              <h3>120</h3>
              <p>Total Students</p>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-card-icon success"><i class="fas fa-user-check"></i></div>
            <div class="stat-card-info">
              <h3>105</h3>
              <p>Today's Attendance</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-icon danger"><i class="fas fa-user-times"></i></div>
            <div class="stat-card-info">
              <h3>15</h3>
              <p>Today's Absences</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-icon warning"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-card-info">
              <h3>3</h3>
              <p>Today's Warnings</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sidebarEl = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      
      if (sidebarToggle && sidebarOverlay && sidebarEl) {
        const toggleSidebar = () => {
          sidebarEl.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
        };
        const closeSidebar = () => {
          sidebarEl.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        };
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
      }
    });
  </script>
</body>
</html>
