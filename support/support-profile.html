<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Assistant Panel</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ctu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/support.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .profile-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 2rem;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    .profile-avatar-container {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-tertiary);
    }
    .avatar-upload-label {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--primary-500);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    .avatar-upload-label:hover {
      background: var(--primary-600);
    }
    .avatar-upload-input {
      display: none;
    }
    .profile-role {
      font-size: 1rem;
      color: var(--primary-500);
      font-weight: 500;
      margin-bottom: 2rem;
    }
    .profile-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
  </style>
</head>
<body>
  <!-- [BACKEND HINT]: Add PHP Session authentication check at the very top of this file. -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p data-i18n="common.loading">Loading...</p>
  </div>

  <div class="dashboard-layout" id="dashboard-layout">
    
    <!-- CTU Support — Sidebar Component -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background: var(--primary-500)">A</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Assistant Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title">Navigation</div>
          <a href="support-overview.html" class="sidebar-link">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
          </a>
          <a href="support-users.html" class="sidebar-link">
            <i class="fas fa-users"></i><span>Students</span>
          </a>
          <a href="support-attendance.html" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span>Attendance</span>
          </a>
          <a href="support-warnings.html" class="sidebar-link">
            <i class="fas fa-exclamation-triangle"></i><span>Warnings</span>
          </a>
          <a href="support-profile.html" class="sidebar-link active">
            <i class="fas fa-user"></i><span>Profile</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="sidebar-link" id="logout-btn" style="color: var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span>Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="../images/team-2.jpg" alt="User Avatar" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name" id="sidebar-user-name">Assistant Name</p>
            <p class="sidebar-user-role" id="sidebar-user-role">Assistant</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title">My Profile</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle" aria-label="Toggle language"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        
        <div class="profile-card">
          <!-- [BACKEND HINT]: Form to update profile details -->
          <form method="POST" action="update_profile.php" enctype="multipart/form-data" class="profile-form">
            
            <div style="text-align: center;">
              <div class="profile-avatar-container">
                <img src="../images/team-2.jpg" alt="Profile" class="profile-avatar" id="avatar-preview">
                <label for="avatar-upload" class="avatar-upload-label" aria-label="Upload new avatar">
                  <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatar-upload" name="profile_picture" class="avatar-upload-input" accept="image/*">
              </div>
              <div class="profile-role">Assistant</div>
            </div>

            <div>
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="Assistant Name" required>
            </div>

            <div>
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control" value="assistant@ctu.edu.eg" required>
            </div>

            <div>
              <label class="form-label">New Password (leave blank to keep current)</label>
              <input type="password" name="password" class="form-control" placeholder="••••••••">
            </div>

            <div style="margin-top: 1rem; text-align: right;">
              <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>

  <!-- Shared Global JS -->
  <script src="../js/app.js"></script>
  <script>
    // Sidebar Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      const sidebarEl = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      
      if (sidebarToggle && sidebarOverlay && sidebarEl) {
        const toggleSidebar = () => {
          sidebarEl.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
        };
        const closeSidebar = () => {
          sidebarEl.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        };
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
      }

      // Avatar Preview Logic
      const avatarInput = document.getElementById('avatar-upload');
      const avatarPreview = document.getElementById('avatar-preview');
      if(avatarInput && avatarPreview) {
        avatarInput.addEventListener('change', function() {
          if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
              avatarPreview.src = e.target.result;
            }
            reader.readAsDataURL(this.files[0]);
          }
        });
      }
    });
  </script>
</body>
</html>
