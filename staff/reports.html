<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Staff Dashboard</title>

  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .report-form-section {
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .report-form-section h4 {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-glass);
    }
    .report-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 768px) {
      .report-form-grid {
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
    }
    .full-width {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p data-i18n="common.loading">Loading...</p>
  </div>

  <div class="dashboard-layout" id="dashboard-layout">
    
    <!-- CTU Support — Sidebar Component -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background: var(--gradient-primary)">L</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Staff Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title">Navigation</div>
          <a href="overview.html" class="sidebar-link">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
          </a>
          <a href="attendance.html" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span>Attendance</span>
          </a>
          <a href="issues.html" class="sidebar-link">
            <i class="fas fa-exclamation-triangle"></i><span>Issues</span>
          </a>
          <a href="custody.html" class="sidebar-link">
            <i class="fas fa-boxes-stacked"></i><span>Custody</span>
          </a>
          <a href="reports.html" class="sidebar-link active">
            <i class="fas fa-file-alt"></i><span>Reports</span>
          </a>
          <a href="profile.html" class="sidebar-link">
            <i class="fas fa-user"></i><span>Profile</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="sidebar-link" id="logout-btn" style="color: var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span>Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="../images/team-2.jpg" alt="User Avatar" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name" id="sidebar-user-name">Eng. Sarah Ahmed</p>
            <p class="sidebar-user-role" id="sidebar-user-role">Lab Supervisor</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title">Daily Reports</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle" aria-label="Toggle language"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        
        <div class="flex-between mb-3">
          <div>
            <h3>Daily Reports</h3>
            <p class="text-muted">Submit your shift report for today</p>
          </div>
        </div>

        <form id="report-form" action="" method="POST">
          
          <div class="report-form-section">
            <h4>Shift Information</h4>
            <div class="report-form-grid">
              <div class="form-group">
                <label class="form-label">Shift</label>
                <select class="form-select" name="shift" required>
                  <option value="morning">Morning</option>
                  <option value="evening">Evening</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Room Number</label>
                <input type="text" class="form-input" name="room" placeholder="e.g. Room 301" required>
              </div>
            </div>
          </div>

          <div class="report-form-section">
            <h4>Personnel</h4>
            <div class="report-form-grid">
              <div class="form-group">
                <label class="form-label">Instructors Present</label>
                <textarea class="form-textarea" name="instructors" rows="2" placeholder="List instructors..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Student Absences</label>
                <textarea class="form-textarea" name="absences" rows="2" placeholder="List absent students..."></textarea>
              </div>
            </div>
          </div>

          <div class="report-form-section">
            <h4>Observations</h4>
            <div class="form-group mb-3">
              <label class="form-label">General Observations</label>
              <textarea class="form-textarea" name="observations" rows="4" placeholder="Any general observations during the shift..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Hardware/Software Issues</label>
              <textarea class="form-textarea" name="issues" rows="3" placeholder="Any issues encountered..."></textarea>
            </div>
          </div>

          <div style="text-align: right;">
            <button type="submit" class="btn btn-primary" style="padding-left: 2rem; padding-right: 2rem;">
              <i class="fas fa-paper-plane" style="margin-right: 0.5rem;"></i> Submit Report
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <!-- Shared Global JS -->
  <script src="../js/app.js"></script>
  <script>
    // Sidebar Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      const sidebarEl = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      
      if (sidebarToggle && sidebarOverlay && sidebarEl) {
        const toggleSidebar = () => {
          sidebarEl.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
        };
        const closeSidebar = () => {
          sidebarEl.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        };
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
      }
    });
  </script>
</body>
</html>
