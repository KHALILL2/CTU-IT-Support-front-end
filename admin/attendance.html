<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — CTU Support Admin</title>
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>
    if (!localStorage.getItem('ctu_auth_token')) {
      window.location.href = '../login.html';
    }
  </script>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="loading-spinner"></div><p data-i18n="common.loading">Loading...</p></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo" style="background:linear-gradient(135deg,#DC2626,#F59E0B)">A</div><div><h4 data-i18n="nav.brand">CTU Support</h4><span>Admin Panel</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-nav-section"><div class="sidebar-nav-section-title" data-i18n="dash.sidebar.management">Management</div>
        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i><span data-i18n="dash.sidebar.dashboard">Dashboard</span></a>
        <a href="students.html" class="sidebar-link"><i class="fas fa-users"></i><span data-i18n="dash.sidebar.students">Students</span></a>
        <a href="attendance.html" class="sidebar-link active"><i class="fas fa-calendar-check"></i><span data-i18n="dash.sidebar.attendance">Attendance</span></a>
        <a href="information.html" class="sidebar-link"><i class="fas fa-chart-bar"></i><span data-i18n="dash.sidebar.information">Information</span></a>
      </div></nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-link" style="color:var(--danger-500)" onclick="localStorage.removeItem('ctu_auth_token')"><i class="fas fa-right-from-bracket"></i><span data-i18n="dash.sidebar.logout">Logout</span></a>
        <div class="sidebar-user"><div class="sidebar-user-avatar"><img src="" alt="" id="sidebar-avatar"></div><div class="sidebar-user-info"><h5 id="sidebar-name"></h5><span id="sidebar-role"></span></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <h2 data-i18n="aatt.title">Attendance Management</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        <!-- Day Controls -->
        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
          <div class="card-actions">
            <div>
              <h4 style="margin-bottom:0.25rem">Day Controls</h4>
              <p style="font-size:0.85rem;color:var(--text-tertiary);margin:0">Manage daily attendance sessions</p>
            </div>
            <div class="day-controls">
              <button class="btn btn-success btn-sm" id="start-day-btn" onclick="startDay()">
                <i class="fas fa-play"></i> <span data-i18n="aatt.start">Start Day</span>
              </button>
              <button class="btn btn-danger btn-sm" id="end-day-btn" onclick="endDay()" disabled>
                <i class="fas fa-stop"></i> <span data-i18n="aatt.end">End Day</span>
              </button>
              <span class="badge badge-progress" id="day-status" style="display:none">
                <i class="fas fa-circle" style="font-size:0.5rem"></i> Active
              </span>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr)">
          <div class="stat-card">
            <div class="stat-card-icon primary"><i class="fas fa-calendar-days"></i></div>
            <div class="stat-card-info"><h3 id="s-total-days">0</h3><p>Total Days</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon success"><i class="fas fa-chart-line"></i></div>
            <div class="stat-card-info"><h3 id="s-avg">0%</h3><p data-i18n="aatt.avg">Average Attendance</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon teal"><i class="fas fa-star"></i></div>
            <div class="stat-card-info"><h3 id="s-active">—</h3><p data-i18n="aatt.active">Most Active</p></div>
          </div>
        </div>

        <!-- Calendar -->
        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
          <h4 class="mb-3" data-i18n="att.calendar">Attendance Calendar</h4>
          <div class="attendance-calendar" id="admin-calendar"></div>
        </div>

        <!-- Selected Day Students -->
        <div class="card" style="padding:1.5rem;display:none" id="day-students-panel">
          <div class="card-actions">
            <h4 id="day-students-title" data-i18n="aatt.students">Students Present</h4>
            <button class="btn btn-ghost btn-sm" onclick="closeDayPanel()"><i class="fas fa-times"></i></button>
          </div>
          <div class="students-grid" id="day-students-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr))"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script>
    let attendanceData = JSON.parse(JSON.stringify(CTU_DATA.attendanceRecords));
    let isDayActive = attendanceData.some(r => r.isActive);

    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
      document.getElementById('lang-toggle')?.addEventListener('click', toggleLanguage);
      loadAdminInfo();
      updateStats();
      renderCalendar();
      updateDayControls();
    });

    window.addEventListener('languageChanged', () => { loadAdminInfo(); renderCalendar(); });

    function loadAdminInfo() {
      const admin = CTU_DATA.currentAdmin;
      document.getElementById('sidebar-avatar').src = admin.image;
      document.getElementById('sidebar-name').textContent = getLocalized(admin, 'name');
      document.getElementById('sidebar-role').textContent = getLocalized(admin, 'role');
    }

    function updateStats() {
      const totalDays = attendanceData.length;
      const totalStudents = CTU_DATA.students.length;
      
      // Average attendance rate
      let totalPresent = 0;
      attendanceData.forEach(r => totalPresent += r.studentIds.length);
      const avgRate = totalDays > 0 ? Math.round((totalPresent / (totalDays * totalStudents)) * 100) : 0;

      // Most active student
      const countMap = {};
      attendanceData.forEach(r => {
        r.studentIds.forEach(id => { countMap[id] = (countMap[id] || 0) + 1; });
      });
      let maxId = null, maxCount = 0;
      for (const [id, count] of Object.entries(countMap)) {
        if (count > maxCount) { maxCount = count; maxId = parseInt(id); }
      }
      const mostActive = CTU_DATA.students.find(s => s.id === maxId);

      animateCounter(document.getElementById('s-total-days'), totalDays, 800);
      document.getElementById('s-avg').textContent = avgRate + '%';
      document.getElementById('s-active').textContent = mostActive ? getLocalized(mostActive, 'name') : '—';
    }

    function renderCalendar() {
      const calendar = document.getElementById('admin-calendar');
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayOfWeek = new Date(year, month, 1).getDay();

      const lang = getCurrentLang();
      const dayNames = lang === 'ar' 
        ? ['أحد', 'اثن', 'ثلا', 'أرب', 'خمي', 'جمع', 'سبت']
        : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const activeDates = new Set(attendanceData.map(r => r.date));

      let html = dayNames.map(d => `<div class="calendar-day-header">${d}</div>`).join('');
      for (let i = 0; i < firstDayOfWeek; i++) html += '<div class="calendar-day empty"></div>';

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = day === today.getDate();
        const hasRecord = activeDates.has(dateStr);
        const isPast = new Date(dateStr) < new Date(today.toDateString());

        let cls = 'calendar-day';
        if (isToday) cls += ' today';
        if (hasRecord) cls += ' present';
        else if (isPast) cls += ' absent';

        html += `<div class="${cls}" onclick="showDayStudents('${dateStr}')" style="cursor:pointer">${day}</div>`;
      }

      calendar.innerHTML = html;
    }

    function showDayStudents(dateStr) {
      const record = attendanceData.find(r => r.date === dateStr);
      const panel = document.getElementById('day-students-panel');
      const grid = document.getElementById('day-students-grid');
      const title = document.getElementById('day-students-title');

      title.textContent = `${t('aatt.students')} — ${formatDate(dateStr)}`;

      if (!record) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-calendar-xmark"></i><h4>${t('common.nodata')}</h4></div>`;
      } else {
        grid.innerHTML = record.studentIds.map(id => {
          const s = CTU_DATA.students.find(st => st.id === id);
          if (!s) return '';
          return `<div class="student-card" style="cursor:default"><img src="${s.image}" alt="${getLocalized(s,'name')}" loading="lazy"><h5>${getLocalized(s,'name')}</h5><span>${getLocalized(s,'department')}</span></div>`;
        }).join('');
      }

      panel.style.display = 'block';
      panel.scrollIntoView({ behavior: 'smooth' });
    }

    function closeDayPanel() {
      document.getElementById('day-students-panel').style.display = 'none';
    }

    function updateDayControls() {
      const startBtn = document.getElementById('start-day-btn');
      const endBtn = document.getElementById('end-day-btn');
      const status = document.getElementById('day-status');

      if (isDayActive) {
        startBtn.disabled = true;
        endBtn.disabled = false;
        status.style.display = 'inline-flex';
      } else {
        startBtn.disabled = false;
        endBtn.disabled = true;
        status.style.display = 'none';
      }
    }

    function startDay() {
      isDayActive = true;
      const today = new Date();
      const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      
      // Check if today already has a record
      if (!attendanceData.find(r => r.date === dateStr)) {
        attendanceData.push({ date: dateStr, studentIds: [], isActive: true });
      }
      
      updateDayControls();
      renderCalendar();
      showToast('Attendance day started!');
    }

    function endDay() {
      isDayActive = false;
      attendanceData.forEach(r => r.isActive = false);
      updateDayControls();
      showToast('Attendance day ended.');
    }
  </script>
</body>
</html>
