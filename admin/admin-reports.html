<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Admin Dashboard</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ctu-theme') || localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark-mode');
      }
      const savedLang = localStorage.getItem('ctu-lang') || localStorage.getItem('language') || 'en';
      document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('lang', savedLang);
    })();
  </script>

  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  
  <style>
    .day-group {
      margin-bottom: 1rem;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-primary);
    }
    .day-header {
      background: var(--bg-secondary);
      padding: 1rem 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      user-select: none;
    }
    .day-header:hover {
      filter: brightness(0.95);
    }
    .day-content {
      display: none;
      padding: 1.5rem;
      border-top: 1px solid var(--border-default);
    }
    .day-content.active {
      display: block;
    }
    .report-card {
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: var(--bg-secondary);
    }
    .report-card:last-child {
      margin-bottom: 0;
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .report-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    .report-meta {
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }
    .report-body {
      padding: 1rem;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .action-btns {
      display: flex;
      gap: 0.5rem;
    }

  </style>
</head>
<body>

  <div class="dashboard-layout" id="dashboard-layout">
    
    <!-- CTU Support — Sidebar Component -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" style="background: linear-gradient(135deg, #DC2626, #F59E0B)">A</div>
        <div>
          <h4 data-i18n="nav.brand">CTU Support</h4>
          <span>Admin Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-section-title">Navigation</div>
          <a href="admin-overview.html" class="sidebar-link">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
          </a>
          <a href="admin-users.html" class="sidebar-link">
            <i class="fas fa-users"></i><span>Users</span>
          </a>
          <a href="admin-attendance.html" class="sidebar-link">
            <i class="fas fa-calendar-check"></i><span>Attendance</span>
          </a>
          <a href="admin-warnings.html" class="sidebar-link">
            <i class="fas fa-exclamation-triangle"></i><span>Warnings</span>
          </a>
          <a href="admin-custody.html" class="sidebar-link">
            <i class="fas fa-boxes-stacked"></i><span>Custody</span>
          </a>
          <a href="admin-reports.html" class="sidebar-link active">
            <i class="fas fa-file-alt"></i><span>Daily Reports</span>
          </a>
          <a href="admin-trainings.html" class="sidebar-link">
            <i class="fas fa-chalkboard-teacher"></i><span>Trainings</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="sidebar-link" id="logout-btn" style="color: var(--danger-500)">
          <i class="fas fa-right-from-bracket"></i><span>Logout</span>
        </a>
        <div class="sidebar-user">
          <div class="sidebar-user-avatar"><img src="../images/avatar-default.png" alt="User Avatar" id="sidebar-avatar"></div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name" id="sidebar-user-name">System Admin</p>
            <p class="sidebar-user-role" id="sidebar-user-role">Administrator</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title">Daily Reports Review</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button type="button" id="lang-toggle" class="topbar-toggle-btn" onclick="if(typeof toggleLanguage==='function')toggleLanguage()" aria-label="Toggle language" title="Toggle Language">
            <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z" stroke="currentColor" stroke-width="2"/><path d="M2 12h20" stroke="currentColor" stroke-width="2"/></svg>
            <span class="lang-pill">عربي</span>
          </button>
          <button type="button" id="theme-toggle" class="topbar-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle Theme">
            <svg class="theme-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
          <div class="search-bar">
            <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);"></i>
            <input type="text" placeholder="Search reports..." style="padding-left: 2.5rem; width: 300px;" class="form-control">
          </div>
          
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" class="btn btn-secondary" onclick="handleDataExport('excel', 'reports', this)"><i class="fas fa-file-excel"></i> Export Excel</button>
            <button type="button" class="btn btn-secondary" onclick="handleDataExport('csv', 'reports', this)"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button type="button" class="btn btn-secondary" onclick="handleDataExport('pdf', 'reports', this)"><i class="fas fa-file-pdf"></i> Export PDF</button>
            <button type="button" class="btn btn-secondary" onclick="handleDataExport('png', 'reports', this)"><i class="fas fa-file-image"></i> Export PNG</button>
          </div>
        </div>

        <div class="table-container" style="background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow-x: auto;">
          <table class="table" style="width: 100%; min-width: 600px; text-align: left; border-collapse: collapse;">
            <thead>
              <tr style="background: var(--bg-secondary); border-bottom: 2px solid var(--border-default);">
                <th style="padding: 1rem;">Day</th>
                <th style="padding: 1rem;">Date</th>
                <th style="padding: 1rem;">Actions</th>
              </tr>
            </thead>
            <tbody id="reports-table-body">
              <!-- [BACKEND HINT]: Loop over unique days that have reports -->
              <tr style="border-bottom: 1px solid var(--border-default);">
                <td style="padding: 1rem;">Monday</td>
                <td style="padding: 1rem;">2026-08-03</td>
                <td style="padding: 1rem;">
                  <div class="action-btns" style="display: flex; gap: 0.25rem;">
                    <!-- [BACKEND HINT]: View opens a modal with all reports for this day -->
                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('viewReportModal').classList.add('active'); document.body.style.overflow='hidden';" title="View Reports"><i class="fas fa-eye"></i> View</button>
                    <!-- [BACKEND HINT]: Export exports the reports for this specific day -->
                    <button type="button" class="btn btn-secondary btn-sm" onclick="/* Handle single day export */" title="Export"><i class="fas fa-file-export"></i> Export</button>
                  </div>
                </td>
              </tr>
              <tr style="border-bottom: 1px solid var(--border-default);">
                <td style="padding: 1rem;">Tuesday</td>
                <td style="padding: 1rem;">2026-08-04</td>
                <td style="padding: 1rem;">
                  <div class="action-btns" style="display: flex; gap: 0.25rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('viewReportModal').classList.add('active'); document.body.style.overflow='hidden';" title="View Reports"><i class="fas fa-eye"></i> View</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="/* Handle single day export */" title="Export"><i class="fas fa-file-export"></i> Export</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

      <!-- View Report Modal -->
      <div id="viewReportModal" class="modal-overlay">
        <div class="modal" style="max-width: 800px; width: 90%;">
          <button type="button" class="btn-icon modal-close" style="position: absolute; top: 1rem; right: 1rem;"><i class="fas fa-times"></i></button>
          <h4 style="margin-bottom: 1.5rem;">Reports for <span id="report-modal-date">Monday, 2026-08-03</span></h4>
          
          <div class="reports-list" style="max-height: 60vh; overflow-y: auto; padding-right: 0.5rem; margin-bottom: 1rem;">
            <!-- [BACKEND HINT]: Loop over all report entries for the selected day -->
            
            <!-- Report Entry 1 -->
            <div class="card" style="padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border-default); border-radius: var(--radius-md);">
              <form method="POST" action="" onsubmit="event.preventDefault(); if(this.closest('.modal-overlay')) this.closest('.modal-overlay').classList.remove('active'); document.body.style.overflow='';">
                <input type="hidden" name="report_id" value="1">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                  <div>
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Hall / Subject</label>
                    <input type="text" name="hall" class="form-control" value="Hall 405 - Robotics" required>
                  </div>
                  <div>
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Supervisor</label>
                    <input type="text" name="supervisor" class="form-control" value="Ahmed Youssef" required>
                  </div>
                </div>
                <div style="margin-bottom: 1rem;">
                  <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Report Content</label>
                  <textarea name="content" class="form-control" rows="3" required>All systems operational. Some minor issues with projectors that were resolved quickly.</textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                  <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-save"></i> Save</button>
                  <button type="button" class="btn btn-secondary btn-sm" style="color: var(--danger-500);"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </form>
            </div>

            <!-- Report Entry 2 -->
            <div class="card" style="padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border-default); border-radius: var(--radius-md);">
              <form method="POST" action="" onsubmit="event.preventDefault(); if(this.closest('.modal-overlay')) this.closest('.modal-overlay').classList.remove('active'); document.body.style.overflow='';">
                <input type="hidden" name="report_id" value="2">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                  <div>
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Hall / Subject</label>
                    <input type="text" name="hall" class="form-control" value="Hall 406 - PC Lab" required>
                  </div>
                  <div>
                    <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Supervisor</label>
                    <input type="text" name="supervisor" class="form-control" value="Sara Mohamed" required>
                  </div>
                </div>
                <div style="margin-bottom: 1rem;">
                  <label style="display: block; margin-bottom: 0.25rem; font-size: 0.85rem; font-weight: 500;">Report Content</label>
                  <textarea name="content" class="form-control" rows="3" required>Routine check completed. No major issues reported.</textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                  <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-save"></i> Save</button>
                  <button type="button" class="btn btn-secondary btn-sm" style="color: var(--danger-500);"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </form>
            </div>
            
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    // Sidebar Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      const sidebarEl = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      
      if (sidebarToggle && sidebarOverlay && sidebarEl) {
        const toggleSidebar = () => {
          sidebarEl.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
        };
        const closeSidebar = () => {
          sidebarEl.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        };
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
      }
    });
  </script>
</body>
</html>
