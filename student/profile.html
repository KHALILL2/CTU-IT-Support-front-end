<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — CTU Support</title>
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>
    if (!localStorage.getItem('ctu_auth_token')) {
      window.location.href = '../login.html';
    }
  </script>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="loading-spinner"></div><p data-i18n="common.loading">Loading...</p></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">C</div><div><h4 data-i18n="nav.brand">CTU Support</h4><span>Student Panel</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-nav-section"><div class="sidebar-nav-section-title" data-i18n="dash.sidebar.general">General</div>
        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i><span data-i18n="dash.sidebar.dashboard">Dashboard</span></a>
        <a href="profile.html" class="sidebar-link active"><i class="fas fa-user"></i><span data-i18n="dash.sidebar.profile">Profile</span></a>
        <a href="attendance.html" class="sidebar-link"><i class="fas fa-calendar-check"></i><span data-i18n="dash.sidebar.attendance">Attendance</span></a>
        <a href="information.html" class="sidebar-link"><i class="fas fa-chart-pie"></i><span data-i18n="dash.sidebar.information">Information</span></a>
      </div></nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-link" style="color:var(--danger-500)" onclick="localStorage.removeItem('ctu_auth_token')"><i class="fas fa-right-from-bracket"></i><span data-i18n="dash.sidebar.logout">Logout</span></a>
        <div class="sidebar-user"><div class="sidebar-user-avatar"><img src="" alt="" id="sidebar-avatar"></div><div class="sidebar-user-info"><h5 id="sidebar-name"></h5><span id="sidebar-role"></span></div></div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <h2 data-i18n="profile.title">My Profile</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        <!-- Profile Header -->
        <div class="profile-header reveal">
          <div class="profile-avatar">
            <img src="" alt="" id="profile-img">
            <label class="profile-avatar-edit" for="avatar-upload">
              <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="avatar-upload" accept="image/*" style="display:none">
          </div>
          <h3 id="profile-display-name"></h3>
          <span class="badge badge-progress" id="profile-display-dept"></span>
        </div>

        <!-- Profile Form -->
        <div class="card" style="padding: 2rem">
          <form id="profile-form" class="profile-form">
            <div class="form-group">
              <label class="form-label" data-i18n="profile.name">Full Name</label>
              <input type="text" class="form-input" id="pf-name">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="profile.dept">Department</label>
              <input type="text" class="form-input" id="pf-dept">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="profile.year">Academic Year</label>
              <input type="text" class="form-input" id="pf-year">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="profile.phone">Phone Number</label>
              <input type="tel" class="form-input" id="pf-phone">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="profile.id">Academic ID</label>
              <input type="text" class="form-input" id="pf-id" readonly style="opacity:0.7;cursor:not-allowed">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="profile.email">Email Address</label>
              <input type="email" class="form-input" id="pf-email">
            </div>
            <div style="grid-column: 1 / -1; margin-top: 0.5rem">
              <button type="submit" class="btn btn-primary btn-lg ripple" data-i18n="profile.update">
                <i class="fas fa-save"></i> Update Data
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
      document.getElementById('lang-toggle')?.addEventListener('click', toggleLanguage);
      loadProfile();
      initProfileForm();
    });

    window.addEventListener('languageChanged', loadProfile);

    function loadProfile() {
      const user = CTU_DATA.currentUser;
      document.getElementById('sidebar-avatar').src = user.image;
      document.getElementById('sidebar-name').textContent = getLocalized(user, 'name');
      document.getElementById('sidebar-role').textContent = getLocalized(user, 'department');
      document.getElementById('profile-img').src = user.image;
      document.getElementById('profile-display-name').textContent = getLocalized(user, 'name');
      document.getElementById('profile-display-dept').textContent = getLocalized(user, 'department');

      document.getElementById('pf-name').value = getLocalized(user, 'name');
      document.getElementById('pf-dept').value = getLocalized(user, 'department');
      document.getElementById('pf-year').value = getLocalized(user, 'year');
      document.getElementById('pf-phone').value = user.phone;
      document.getElementById('pf-id').value = user.academicId;
      document.getElementById('pf-email').value = user.email;
    }

    function initProfileForm() {
      // Avatar upload preview
      document.getElementById('avatar-upload')?.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            document.getElementById('profile-img').src = ev.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      // Form submit
      document.getElementById('profile-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        showToast(t('profile.updated'));
      });
    }
  </script>
</body>
</html>
