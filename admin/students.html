<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — CTU Support Admin</title>
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>
    if (!localStorage.getItem('ctu_auth_token')) {
      window.location.href = '../login.html';
    }
  </script>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="loading-spinner"></div><p data-i18n="common.loading">Loading...</p></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo" style="background:linear-gradient(135deg,#DC2626,#F59E0B)">A</div><div><h4 data-i18n="nav.brand">CTU Support</h4><span>Admin Panel</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-nav-section"><div class="sidebar-nav-section-title" data-i18n="dash.sidebar.management">Management</div>
        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i><span data-i18n="dash.sidebar.dashboard">Dashboard</span></a>
        <a href="students.html" class="sidebar-link active"><i class="fas fa-users"></i><span data-i18n="dash.sidebar.students">Students</span></a>
        <a href="attendance.html" class="sidebar-link"><i class="fas fa-calendar-check"></i><span data-i18n="dash.sidebar.attendance">Attendance</span></a>
        <a href="information.html" class="sidebar-link"><i class="fas fa-chart-bar"></i><span data-i18n="dash.sidebar.information">Information</span></a>
      </div></nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-link" style="color:var(--danger-500)" onclick="localStorage.removeItem('ctu_auth_token')"><i class="fas fa-right-from-bracket"></i><span data-i18n="dash.sidebar.logout">Logout</span></a>
        <div class="sidebar-user"><div class="sidebar-user-avatar"><img src="" alt="" id="sidebar-avatar"></div><div class="sidebar-user-info"><h5 id="sidebar-name"></h5><span id="sidebar-role"></span></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <h2 data-i18n="astudents.title">Student Directory</h2>
        </div>
        <div class="dashboard-topbar-right">
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="search-input" data-i18n-placeholder="astudents.search" placeholder="Search students..." oninput="filterStudents()"></div>
          <button class="btn btn-primary btn-sm" onclick="openAddModal()"><i class="fas fa-plus"></i> <span data-i18n="astudents.add">Add Student</span></button>
          <button class="btn-icon navbar-action-btn" id="lang-toggle"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        <!-- Detail Panel (hidden by default) -->
        <div class="detail-panel" id="detail-panel">
          <div class="detail-panel-header">
            <img src="" alt="" id="detail-img">
            <div>
              <h3 id="detail-name"></h3>
              <span class="badge badge-progress" id="detail-dept"></span>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="closeDetailPanel()" style="margin-left:auto"><i class="fas fa-times"></i></button>
          </div>
          <div class="detail-panel-fields" id="detail-fields"></div>
        </div>

        <!-- Students Grid -->
        <div class="students-grid" id="students-grid"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Student Modal -->
  <div class="modal-overlay" id="student-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeStudentModal()">×</button>
      <div class="modal-header"><h3 id="student-modal-title" data-i18n="astudents.add">Add Student</h3></div>
      <form id="student-form">
        <input type="hidden" id="sf-id">
        <div class="form-group"><label class="form-label" data-i18n="profile.name">Name</label><input type="text" class="form-input" id="sf-name" required></div>
        <div class="form-group"><label class="form-label" data-i18n="profile.email">Email</label><input type="email" class="form-input" id="sf-email" required></div>
        <div class="form-group"><label class="form-label" data-i18n="profile.dept">Department</label><input type="text" class="form-input" id="sf-dept"></div>
        <div class="form-group"><label class="form-label" data-i18n="profile.year">Year</label><input type="text" class="form-input" id="sf-year"></div>
        <div class="form-group"><label class="form-label" data-i18n="profile.phone">Phone</label><input type="tel" class="form-input" id="sf-phone"></div>
        <div class="form-group"><label class="form-label" data-i18n="profile.id">Academic ID</label><input type="text" class="form-input" id="sf-acid"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeStudentModal()" data-i18n="common.cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal" style="text-align:center">
      <div style="font-size:3rem;color:var(--danger-500);margin-bottom:1rem"><i class="fas fa-triangle-exclamation"></i></div>
      <h3 data-i18n="admin.delete.title">Delete Student</h3>
      <p class="mt-2">Are you sure you want to remove this student?</p>
      <div class="modal-footer" style="justify-content:center">
        <button class="btn btn-ghost" onclick="closeDeleteModal()" data-i18n="admin.delete.no">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete-btn" data-i18n="admin.delete.yes">Delete</button>
      </div>
    </div>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script>
    let students = JSON.parse(JSON.stringify(CTU_DATA.students));
    let deleteTargetId = null;
    let editingStudentId = null;

    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
      document.getElementById('lang-toggle')?.addEventListener('click', toggleLanguage);
      loadAdminInfo();
      renderStudents();
      initStudentForm();
    });

    window.addEventListener('languageChanged', () => { loadAdminInfo(); renderStudents(); });

    function loadAdminInfo() {
      const admin = CTU_DATA.currentAdmin;
      document.getElementById('sidebar-avatar').src = admin.image;
      document.getElementById('sidebar-name').textContent = getLocalized(admin, 'name');
      document.getElementById('sidebar-role').textContent = getLocalized(admin, 'role');
    }

    function renderStudents(list) {
      const grid = document.getElementById('students-grid');
      const data = list || students;
      grid.innerHTML = data.map(s => `
        <div class="student-card" onclick="showStudentDetail(${s.id})">
          <img src="${s.image}" alt="${getLocalized(s, 'name')}" loading="lazy">
          <h5>${getLocalized(s, 'name')}</h5>
          <span>${getLocalized(s, 'department')}</span>
          <div style="margin-top:0.75rem;display:flex;gap:0.5rem;justify-content:center">
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openEditModal(${s.id})" title="${t('astudents.edit')}"><i class="fas fa-pen"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openDeleteModal(${s.id})" title="${t('astudents.delete')}" style="color:var(--danger-500)"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function filterStudents() {
      const q = document.getElementById('search-input').value.toLowerCase();
      if (!q) { renderStudents(); return; }
      const filtered = students.filter(s =>
        s.name.toLowerCase().includes(q) || s.nameAr.includes(q) || s.email.includes(q) || s.academicId.toLowerCase().includes(q)
      );
      renderStudents(filtered);
    }

    function showStudentDetail(id) {
      const s = students.find(st => st.id === id);
      if (!s) return;
      const panel = document.getElementById('detail-panel');
      document.getElementById('detail-img').src = s.image;
      document.getElementById('detail-name').textContent = getLocalized(s, 'name');
      document.getElementById('detail-dept').textContent = getLocalized(s, 'department');
      
      const fields = document.getElementById('detail-fields');
      fields.innerHTML = [
        { label: t('profile.email'), value: s.email },
        { label: t('profile.phone'), value: s.phone },
        { label: t('profile.year'), value: getLocalized(s, 'year') },
        { label: t('profile.id'), value: s.academicId },
        { label: t('info.total.att'), value: s.attendance + ' days' },
        { label: t('info.completed'), value: s.tasks + ' tasks' }
      ].map(f => `<div class="detail-field"><label>${f.label}</label><p>${f.value}</p></div>`).join('');

      panel.classList.add('active');
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeDetailPanel() { document.getElementById('detail-panel').classList.remove('active'); }

    // Add/Edit Modal
    function openAddModal() {
      editingStudentId = null;
      document.getElementById('student-modal-title').textContent = t('astudents.add');
      document.getElementById('student-form').reset();
      document.getElementById('sf-id').value = '';
      document.getElementById('student-modal').classList.add('active');
    }

    function openEditModal(id) {
      const s = students.find(st => st.id === id);
      if (!s) return;
      editingStudentId = id;
      document.getElementById('student-modal-title').textContent = t('astudents.edit');
      document.getElementById('sf-id').value = id;
      document.getElementById('sf-name').value = s.name;
      document.getElementById('sf-email').value = s.email;
      document.getElementById('sf-dept').value = s.department;
      document.getElementById('sf-year').value = s.year;
      document.getElementById('sf-phone').value = s.phone;
      document.getElementById('sf-acid').value = s.academicId;
      document.getElementById('student-modal').classList.add('active');
    }

    function closeStudentModal() { document.getElementById('student-modal').classList.remove('active'); editingStudentId = null; }

    function initStudentForm() {
      document.getElementById('student-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('sf-name').value;
        const email = document.getElementById('sf-email').value;
        const dept = document.getElementById('sf-dept').value;
        const year = document.getElementById('sf-year').value;
        const phone = document.getElementById('sf-phone').value;
        const acid = document.getElementById('sf-acid').value;

        if (editingStudentId) {
          const s = students.find(st => st.id === editingStudentId);
          if (s) { Object.assign(s, { name, email, department: dept, year, phone, academicId: acid }); }
          showToast('Student updated!');
        } else {
          const newId = Math.max(...students.map(s => s.id)) + 1;
          students.push({
            id: newId, name, nameAr: name, department: dept, departmentAr: dept,
            year, yearAr: year, phone, academicId: acid, email,
            image: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&size=200&background=6366F1&color=fff`,
            attendance: 0, tasks: 0
          });
          showToast('Student added!');
        }
        renderStudents();
        closeStudentModal();
      });
    }

    // Delete Modal
    function openDeleteModal(id) {
      deleteTargetId = id;
      document.getElementById('delete-modal').classList.add('active');
      document.getElementById('confirm-delete-btn').onclick = () => {
        students = students.filter(s => s.id !== deleteTargetId);
        renderStudents();
        closeDeleteModal();
        closeDetailPanel();
        showToast('Student removed.');
      };
    }
    function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('active'); deleteTargetId = null; }

    document.getElementById('student-modal')?.addEventListener('click', (e) => { if (e.target === e.currentTarget) closeStudentModal(); });
    document.getElementById('delete-modal')?.addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDeleteModal(); });
  </script>
</body>
</html>
