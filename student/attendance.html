<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — CTU Support</title>
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>
    if (!localStorage.getItem('ctu_auth_token')) {
      window.location.href = '../login.html';
    }
  </script>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="loading-spinner"></div><p data-i18n="common.loading">Loading...</p></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">C</div><div><h4 data-i18n="nav.brand">CTU Support</h4><span>Student Panel</span></div></div>
      <nav class="sidebar-nav"><div class="sidebar-nav-section"><div class="sidebar-nav-section-title" data-i18n="dash.sidebar.general">General</div>
        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i><span data-i18n="dash.sidebar.dashboard">Dashboard</span></a>
        <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i><span data-i18n="dash.sidebar.profile">Profile</span></a>
        <a href="attendance.html" class="sidebar-link active"><i class="fas fa-calendar-check"></i><span data-i18n="dash.sidebar.attendance">Attendance</span></a>
        <a href="information.html" class="sidebar-link"><i class="fas fa-chart-pie"></i><span data-i18n="dash.sidebar.information">Information</span></a>
      </div></nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="sidebar-link" style="color:var(--danger-500)" onclick="localStorage.removeItem('ctu_auth_token')"><i class="fas fa-right-from-bracket"></i><span data-i18n="dash.sidebar.logout">Logout</span></a>
        <div class="sidebar-user"><div class="sidebar-user-avatar"><img src="" alt="" id="sidebar-avatar"></div><div class="sidebar-user-info"><h5 id="sidebar-name"></h5><span id="sidebar-role"></span></div></div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <h2 data-i18n="att.title">Attendance</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition">
        <!-- Register Attendance Action -->
        <div class="attendance-action reveal">
          <h3 style="margin-bottom:1rem" data-i18n="att.register">Register Attendance</h3>
          <button class="btn btn-primary btn-lg glow-pulse ripple" id="register-btn" onclick="registerAttendance()">
            <i class="fas fa-fingerprint"></i>
            <span data-i18n="att.register">Register Attendance</span>
          </button>

          <div class="attendance-counter">
            <div class="counter-item">
              <h3 id="att-days">0</h3>
              <p data-i18n="att.days">Days Attended</p>
            </div>
            <div class="counter-item">
              <h3 id="att-streak">0</h3>
              <p data-i18n="att.streak">Current Streak</p>
            </div>
          </div>
        </div>

        <!-- Calendar -->
        <div class="card" style="padding: 1.5rem">
          <h4 class="mb-3" data-i18n="att.calendar">Attendance Calendar</h4>
          <div class="attendance-calendar" id="attendance-calendar">
            <!-- Populated by JS -->
          </div>

          <div style="display:flex; gap:1.5rem; margin-top:1.5rem; flex-wrap:wrap">
            <div style="display:flex; align-items:center; gap:0.5rem">
              <div style="width:16px;height:16px;border-radius:4px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3)"></div>
              <span style="font-size:0.8rem;color:var(--text-tertiary)">Present</span>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem">
              <div style="width:16px;height:16px;border-radius:4px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2)"></div>
              <span style="font-size:0.8rem;color:var(--text-tertiary)">Absent</span>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem">
              <div style="width:16px;height:16px;border-radius:4px;border:2px solid var(--primary-500)"></div>
              <span style="font-size:0.8rem;color:var(--text-tertiary)">Today</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script>
    let isRegistered = false;

    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
      document.getElementById('lang-toggle')?.addEventListener('click', toggleLanguage);
      loadUserInfo();
      renderCalendar();
      updateStats();
    });

    window.addEventListener('languageChanged', () => { loadUserInfo(); renderCalendar(); });

    function loadUserInfo() {
      const user = CTU_DATA.currentUser;
      document.getElementById('sidebar-avatar').src = user.image;
      document.getElementById('sidebar-name').textContent = getLocalized(user, 'name');
      document.getElementById('sidebar-role').textContent = getLocalized(user, 'department');
    }

    function registerAttendance() {
      const btn = document.getElementById('register-btn');
      if (isRegistered) return;
      
      // Show waiting state
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${t('att.waiting')}</span>`;
      btn.classList.remove('glow-pulse');
      
      setTimeout(() => {
        isRegistered = true;
        btn.innerHTML = `<i class="fas fa-check-circle"></i> <span>${t('att.registered')}</span>`;
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-success');
        btn.style.pointerEvents = 'none';
        
        // Update counter
        const daysEl = document.getElementById('att-days');
        const current = parseInt(daysEl.textContent) || 0;
        animateCounter(daysEl, current + 1, 600);
        
        showToast(t('att.registered'));
      }, 1500);
    }

    function updateStats() {
      const userId = CTU_DATA.currentUser.id;
      const daysAttended = CTU_DATA.attendanceRecords.filter(
        r => r.studentIds.includes(userId)
      ).length;
      
      // Calculate streak
      let streak = 0;
      const sortedRecords = [...CTU_DATA.attendanceRecords].sort(
        (a, b) => new Date(b.date) - new Date(a.date)
      );
      for (const record of sortedRecords) {
        if (record.studentIds.includes(userId)) {
          streak++;
        } else {
          break;
        }
      }

      animateCounter(document.getElementById('att-days'), daysAttended, 1000);
      animateCounter(document.getElementById('att-streak'), streak, 1000);
    }

    function renderCalendar() {
      const calendar = document.getElementById('attendance-calendar');
      if (!calendar) return;

      const userId = CTU_DATA.currentUser.id;
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth(); // July = 6

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayOfWeek = new Date(year, month, 1).getDay();

      const lang = getCurrentLang();
      const dayNames = lang === 'ar' 
        ? ['أحد', 'اثن', 'ثلا', 'أرب', 'خمي', 'جمع', 'سبت']
        : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      // Build attendance map for this month
      const attendanceDates = new Set();
      CTU_DATA.attendanceRecords.forEach(record => {
        if (record.studentIds.includes(userId)) {
          attendanceDates.add(record.date);
        }
      });

      let html = dayNames.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

      // Empty cells before first day
      for (let i = 0; i < firstDayOfWeek; i++) {
        html += '<div class="calendar-day empty"></div>';
      }

      // Day cells
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = day === today.getDate();
        const isPresent = attendanceDates.has(dateStr);
        const isPast = new Date(dateStr) < new Date(today.toDateString());
        
        let classes = 'calendar-day';
        if (isToday) classes += ' today';
        if (isPresent) classes += ' present';
        else if (isPast && day > 0) classes += ' absent';

        html += `<div class="${classes}">${day}</div>`;
      }

      calendar.innerHTML = html;
    }
  </script>
</body>
</html>
