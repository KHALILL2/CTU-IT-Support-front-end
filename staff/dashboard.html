<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — CTU Support</title>

  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p data-i18n="common.loading">Loading...</p>
  </div>

  <div class="dashboard-layout" id="dashboard-layout">
    <!-- Sidebar will be injected here by sidebar.js -->

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
          <h2 id="topbar-title" data-i18n="dash.sidebar.dashboard">Dashboard</h2>
        </div>
        <div class="dashboard-topbar-right">
          <button class="btn-icon navbar-action-btn" id="lang-toggle" aria-label="Toggle language"><i class="fas fa-globe"></i></button>
          <button class="btn-icon navbar-action-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
        </div>
      </header>

      <div class="dashboard-content page-transition" id="view">
        <!-- Views will be rendered here by dashboardRouter -->
      </div>
    </main>
  </div>

  <!-- Shared Global JS -->
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>

  <script type="module">
    import { requiresRole } from '../js/router/guard.js';
    import { logout, ROLE_LABELS } from '../js/api/auth.js';
    import { initRouter, registerRoutes } from '../js/router/dashboardRouter.js';
    import { getUser, getRole } from '../js/utils/jwt.js';
    import { createSidebar } from '../js/components/sidebar.js';

    // 1. Role Guard — allow both staff roles
    requiresRole(['lab_supervisor', 'it_support']);

    // 2. Read role and user info
    const role = getRole();
    const user = getUser();

    // 3. Set role class on body for CSS-based visibility toggling
    document.body.classList.add(role === 'lab_supervisor' ? 'role-lab' : 'role-it');

    // 4. Build and mount sidebar
    const { el: sidebarEl } = createSidebar({
      role,
      userName: window.getLocalized ? window.getLocalized(user, 'name') : (user?.name || ''),
      userRoleLabel: ROLE_LABELS[role] || role,
      avatarSrc: user?.avatar || '',
      onLogout: async () => {
        await logout();
        window.location.href = '../login.html';
      }
    });

    const layout = document.getElementById('dashboard-layout');
    layout.insertBefore(sidebarEl, layout.firstChild);

    // Sidebar Toggle Logic
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    if (sidebarToggle && sidebarOverlay && sidebarEl) {
      const toggleSidebar = () => {
        sidebarEl.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      };
      const closeSidebar = () => {
        sidebarEl.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      };
      sidebarToggle.addEventListener('click', toggleSidebar);
      sidebarOverlay.addEventListener('click', closeSidebar);
      window.addEventListener('hashchange', closeSidebar);
    }

    // 5. Register routes — conditionally include role-specific routes
    const routes = {
      'overview': async (container) => {
        document.getElementById('topbar-title').textContent = 'Dashboard';
        const m = await import('../js/views/staff/overview.js');
        return await m.render(container);
      },
      'attendance': async (container) => {
        document.getElementById('topbar-title').textContent = 'Attendance';
        const m = await import('../js/views/staff/attendance.js');
        return await m.render(container, role);
      },
      'issues': async (container) => {
        document.getElementById('topbar-title').textContent = 'Issues';
        const m = await import('../js/views/staff/issues.js');
        return await m.render(container, role);
      },
      'custody': async (container) => {
        document.getElementById('topbar-title').textContent = 'Custody';
        const m = await import('../js/views/staff/custody.js');
        return await m.render(container, role);
      },
      'profile': async (container) => {
        document.getElementById('topbar-title').textContent = 'Profile';
        const m = await import('../js/views/staff/profile.js');
        return await m.render(container);
      },
    };

    // Lab Supervisor only: Daily Reports
    if (role === 'lab_supervisor') {
      routes['reports'] = async (container) => {
        document.getElementById('topbar-title').textContent = 'Daily Reports';
        const m = await import('../js/views/staff/reports.js');
        return await m.render(container);
      };
    }

    registerRoutes(routes);

    const viewContainer = document.getElementById('view');
    initRouter(viewContainer);

    // 6. Theme and Language toggles
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn && window.toggleTheme) {
      themeBtn.addEventListener('click', window.toggleTheme);
    }

    const langBtn = document.getElementById('lang-toggle');
    if (langBtn && window.toggleLanguage) {
      langBtn.addEventListener('click', window.toggleLanguage);
    }
  </script>
</body>
</html>
